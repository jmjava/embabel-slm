name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest -v
      - name: Frozen bars self-test
        run: python scripts/check_m0_bars.py --self-test
      - name: Frozen prereg self-test
        run: python scripts/check_prereg.py --self-test
      - name: Analysis smoke
        run: python -m analysis power

  maven-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('runner/maven.py') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Runner compile selftest
        run: python -m runner selftest